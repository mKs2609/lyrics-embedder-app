name: Generate Application APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to manually trigger a compile run via GitHub's dashboard

jobs:
  build:
    name: Compile App Bundle
    runs-on: ubuntu-latest #

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 #

      - name: Initialize JDK 17
        uses: actions/setup-java@v3 #
        with:
          distribution: 'temurin'
          java-version: '17' #
          cache: 'gradle'

      - name: Set Execution Rights
        run: chmod +x./gradlew

      - name: Assemble Debug Package
        run:./gradlew assembleDebug #

      - name: Export Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncedLyricsEmbedder-APK
          path: app/build/outputs/apk/debug/app-debug.apk #
