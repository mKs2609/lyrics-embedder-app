name: Generate Application APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compile App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Gradle
        run: sudo apt-get install gradle -y

      - name: Assemble Debug Package
        run: gradle assembleDebug

      - name: Export Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncedLyricsEmbedder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
